name: Offline checks and release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: |
          npm ci --ignore-scripts --no-fund
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check repository, syntax and formatting
        run: npm run check
      - name: Unit and packaging tests
        run: |
          npm run test:unit
          npm run test:release
      - name: Offline browser integration
        run: python tools/run_browser_checks.py --browser chromium --jobs 2
      - name: Build install and source archives
        run: npm run build
      - name: Upload verified archives
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: study-pilot-edge
          path: dist/
          if-no-files-found: error
          retention-days: 14
