name: Offline checks and release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development tools
        run: |
          npm ci --ignore-scripts --no-fund
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check repository, syntax and formatting
        run: npm run check
      - name: Check release tag matches source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/prepare_release.py --tag "$RELEASE_TAG"
      - name: Unit and packaging tests
        run: |
          npm run test:unit
          npm run test:release
      - name: Offline browser integration
        run: python tools/run_browser_checks.py --browser chromium --jobs 2
      - name: Build install and source archives
        run: npm run build
      - name: Verify archive contents and checksums
        run: python tools/prepare_release.py --artifacts dist
      - name: Upload verified archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-pilot-edge
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: study-pilot-edge
          path: dist
      - name: Validate release inputs and generate notes
        env:
          CHECKS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/prepare_release.py --tag "$RELEASE_TAG" --artifacts dist --output .release-notes.md --checks-url "$CHECKS_URL"
      - name: Publish verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            if ! python -c 'import json; raise SystemExit(0 if json.load(open("release-state.json"))["isDraft"] else 1)'; then
              echo "Release is already public; preserving its existing assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "课伴 $RELEASE_TAG" --notes-file .release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "dist/study-pilot-edge-$RELEASE_TAG.zip" "dist/study-pilot-edge-source-$RELEASE_TAG.zip" dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file .release-notes.md
