<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课伴 · 课程助手</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <div class="popup-hero">
      <header class="header">
        <div class="brand">
          <div class="brandmark" aria-hidden="true">伴</div>
          <div>
            <div class="brand-row">
              <h1>课伴</h1>
              <span class="version-pill">v0.8.7</span>
            </div>
            <p class="eyebrow">学习通 / 中国大学MOOC 智能托管舱</p>
          </div>
        </div>
        <button id="settings" class="btn-glass" title="打开设置">
          <svg
            aria-hidden="true"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
          设置
        </button>
      </header>
      <div id="status" class="statusbar" role="status">
        <strong id="statusTitle">正在连接</strong>
        <p id="statusDetail">读取当前课程状态…</p>
      </div>
      <div class="actions actions-primary">
        <button id="start" class="primary">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v14l11-7-11-7z" />
          </svg>
          开始托管
        </button>
        <button id="stop" class="btn-stop">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
          停止
        </button>
      </div>
    </div>

    <p id="message" class="message" role="status"></p>

    <div class="stats">
      <div>
        <b id="videos">0</b>
        <span>已结束 / 识别视频</span>
      </div>
      <div>
        <b id="calls">0</b>
        <span>本轮 API 请求</span>
      </div>
      <div>
        <b id="tokens">0</b>
        <span>本轮 Tokens</span>
      </div>
    </div>

    <div class="quick-dock">
      <div class="dock-label">
        <span>单页快捷操作</span>
        <small>逐步执行 · 按需介入</small>
      </div>
      <div class="actions actions-secondary">
        <button id="scan" class="btn-neo">
          <svg
            aria-hidden="true"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"
            />
          </svg>
          解析并自动作答
        </button>
        <button id="fill" class="btn-neo">
          <svg
            aria-hidden="true"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
          填写已解析答案
        </button>
      </div>
    </div>

    <div class="sectiontitle">
      <h2>最近解析</h2>
      <span id="confidence" class="subtle"></span>
    </div>
    <div id="result" class="result" hidden>
      <h3 id="question"></h3>
      <div id="answer" class="answer"></div>
      <p id="explanation" class="explanation"></p>
    </div>
    <p id="noResult" class="empty">解析完成后，在这里查看答案与推导过程。</p>

    <div class="sectiontitle">
      <h2>运行记录</h2>
      <span class="subtle">当前标签页</span>
    </div>
    <ul id="logs" class="log"></ul>
    <footer>自选模型 · 图文解题与课程控制<br />0.8.7 · 支持学习通与中国大学MOOC</footer>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
